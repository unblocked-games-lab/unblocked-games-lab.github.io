<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Watermelon Game</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #070b14;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #thegame {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }
        canvas {
            display: block;
            margin: auto;
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
        }
    </style>
    <script src="phaser.min.js"></script>
    <script src="game.js"></script>
</head>
<body>
    <div id="thegame"></div>
</body>
</html>
