<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>1v1.LOL Unblocked</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #070b14;
            overflow: hidden;
        }
        #game-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        #loading-overlay {
            position: absolute;
            inset: 0;
            background: #070b14;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            transition: opacity 0.5s ease;
            z-index: 10;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <img src="logo.png" alt="1v1.LOL" style="height: 64px; object-fit: contain;">
        <div class="spinner"></div>
        <p style="color: #94a3b8; font-size: 14px;">Connecting to 1v1.LOL Arena...</p>
    </div>
    <iframe 
        id="game-frame" 
        src="https://1v1.lol/" 
        allow="autoplay; fullscreen; pointer-lock; camera; microphone; clipboard-read; clipboard-write; web-share" 
        allowfullscreen>
    </iframe>
    <script>
        const frame = document.getElementById('game-frame');
        const overlay = document.getElementById('loading-overlay');
        
        function dismissOverlay() {
            if (!overlay) return;
            overlay.style.opacity = '0';
            setTimeout(() => {
                if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
            }, 500);
        }

        frame.addEventListener('load', () => {
            setTimeout(dismissOverlay, 800);
        });

        // Fallback dismissal after 4s in case load event was consumed
        setTimeout(dismissOverlay, 4000);
    </script>
</body>
</html>
