<!DOCTYPE html>
<html lang="en">
<head>
<script>
    window["GD_OPTIONS"] = {
      gameId: "snowrider3d",
      onEvent: function(event) {},
      prefix: "gd_"
    };
    </script>
    <meta charset="utf-8">
    <title>Snow Rider 3D</title>
    
    

    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link href="themes.css" rel="stylesheet"/>
    <script src="UnityProgress.js"></script>
    <script src="UnityLoader.js"></script>
    <script>
        var gameInstance = UnityLoader.instantiate("gameContainer", "SnowRider3D-gd-1.json", {
            onProgress: UnityProgress,
            Module: {
                onRuntimeInitialized: function () {
                    UnityProgress(gameInstance, "complete");
                    const dismissModal = () => {
                        try { gameInstance.SendMessage('', 'CloseLoginRegisterGui'); } catch(e) {}
                        try { gameInstance.SendMessage('', 'CloseGui'); } catch(e) {}
                        try { gameInstance.SendMessage('', 'CloseAutoLoginGui'); } catch(e) {}
                    };
                    setTimeout(dismissModal, 500);
                    setTimeout(dismissModal, 1500);
                },
            },
        });
    </script>
</head>
<body>
<div class="webgl-content">
    <div id="gameContainer" style="width: 100%; height: 100%; margin: auto"></div>
</div>
</body>
</html>
